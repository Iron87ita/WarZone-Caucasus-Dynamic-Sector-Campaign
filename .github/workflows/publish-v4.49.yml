name: Publish WarZone v4.49

on:
  push:
    branches: [main]
    paths:
      - 'releases/v4.49/**'
      - '.github/workflows/publish-v4.49.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warzone-release-v4.49
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Iron87ita/WarZone-Caucasus-Dynamic-Sector-Campaign' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release package
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and publish v4.49
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 releases/v4.49/publish_release.py

